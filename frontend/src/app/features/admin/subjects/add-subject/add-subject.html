<div class="page-wrapper form-page">

  <!-- Welcome Banner -->
  <div class="welcome-banner">
    <div class="welcome-content">
      <div class="welcome-avatar">
        <i class="fa-solid fa-book-bookmark"></i>
      </div>
      <div>
        <h2>Add Subject</h2>
        <p>Create a new course and assign it to a faculty member for attendance tracking</p>
      </div>
    </div>
    <a mat-flat-button routerLink="/dashboard/subjects" class="add-btn">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Subjects</span>
    </a>
  </div>

  <!-- Form Card -->
  <div class="va-card form-card">
    <form (ngSubmit)="save()" #subjectForm="ngForm">
      
      <div class="form-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
        
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width" style="width: 100%;">
            <mat-label>Subject Name</mat-label>
            <mat-icon matPrefix>book</mat-icon>
            <input matInput [(ngModel)]="subjectData.name" name="name" placeholder="e.g. Distributed Systems" required />
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width" style="width: 100%;">
            <mat-label>Department</mat-label>
            <mat-icon matPrefix>school</mat-icon>
            <input matInput [(ngModel)]="subjectData.department" name="department" placeholder="e.g. Computer Engineering" required />
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width" style="width: 100%;">
            <mat-label>Semester</mat-label>
            <mat-icon matPrefix>tag</mat-icon>
            <input matInput type="number" min="1" max="8" [(ngModel)]="subjectData.semester" name="semester" placeholder="e.g. 5" required />
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width" style="width: 100%;">
            <mat-label>Faculty In-Charge</mat-label>
            <mat-icon matPrefix>person</mat-icon>
            <mat-select [(ngModel)]="subjectData.facultyId" name="facultyId" required>
              <mat-option *ngFor="let faculty of faculties" [value]="faculty.id">
                {{ faculty.user.fullName }} ({{ faculty.department }})
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

      </div>

      <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <button mat-stroked-button type="button" routerLink="/dashboard/subjects" style="border-radius: 8px; font-weight: 600;">
          Cancel
        </button>
        <button mat-flat-button color="primary" type="submit" [disabled]="saving || !subjectForm.valid" class="save-btn" style="background: var(--primary) !important; color: #fff !important; font-weight: 700; border-radius: 8px; padding: 10px 24px;">
          @if (saving) {
            <mat-spinner diameter="18" color="accent"></mat-spinner>
            <span>Saving…</span>
          } @else {
            <i class="fa-solid fa-floppy-disk" style="margin-right: 6px;"></i>
            <span>Save Subject</span>
          }
        </button>
      </div>

    </form>
  </div>

</div>
