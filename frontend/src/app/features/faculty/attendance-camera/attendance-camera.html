<div class="camera-card va-card">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-indicator">
      <div class="pulse-dot" [class.paused-dot]="!isScanning"></div>
      <span class="status-text">{{ status }}</span>
    </div>
    <button mat-stroked-button class="scan-toggle-btn" [class.resuming-btn]="!isScanning" type="button" (click)="toggleScanning()" id="toggle-scan-btn">
      <i class="fa-solid" [ngClass]="isScanning ? 'fa-pause' : 'fa-play'"></i>
      <span>{{ isScanning ? 'Stop Face Scanning' : 'Resume Face Scanning' }}</span>
    </button>
  </div>

  <!-- Webcam -->
  <div class="camera-wrapper">
    <webcam [trigger]="triggerObservable" (imageCapture)="handleImage($event)" (initError)="handleCameraError($event)" class="webcam-view"></webcam>

    <!-- Scanning overlay -->
    <div class="scan-overlay">
      <div class="scan-line" [class.scanning]="!processing && isScanning"></div>
    </div>

    <!-- Processing indicator -->
    @if (processing) {
      <div class="processing-badge">
        <mat-spinner diameter="14"></mat-spinner>
        <span>Analyzing…</span>
      </div>
    }
  </div>

  <p class="camera-hint">
    <i class="fa-solid fa-circle-info"></i>
    A frame is automatically captured and analyzed every ~1.2 seconds when scanning is active
  </p>

</div>
